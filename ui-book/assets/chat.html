<!doctype html>
<!--
  UI Book — "ask the book" page. Static; needs assets/book-index.js(.json) and
  assets/book-figures.js(.json) from scripts/build-index.mjs.
  - On claude.ai (published as an artifact with the `sample` capability) Claude answers,
    only from retrieved book fragments, with [[id]] citations rendered as chapter chips
    and the cited figure (animated flow / screen map) embedded live.
  - Anywhere else (file://, a static host) it falls back to lexical search (BM25).
  Configure ONLY the CONFIG block below; set <html lang> to the book's language.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the book</title>
<meta name="description" content="Ask about a screen, a button or a message and get the answer from the book, with the picture and the chapter.">
<link rel="stylesheet" href="assets/book.css">
<link rel="stylesheet" href="assets/mock.css">
<script src="assets/book.js" defer></script>
<script>
/* ============================== CONFIG ============================== */
window.BOOK_CHAT = {
  book: "{{BOOK_TITLE}}",                 // e.g. "The Acme Book"
  about: "{{ABOUT}}",                     // one sentence for Claude: what the book covers and who asks
  store: "ui-book-chat:v1",               // localStorage key (per-viewer convenience only)
  cover: "cuprins.html",                  // the cover / contents page
  // [tag, colour class ("" | "pl" | "ad"), question]; tags usually = parts
  suggestions: [
    ["{{PART}}", "", "{{A question a new user would really ask}}"],
    ["{{PART}}", "pl", "{{How do I … ?}}"],
    ["{{PART}}", "ad", "{{What does the “…” button do?}}"]
  ],
  // words in a question that name a part ("admin", "mobile"), mapped to the part name
  // used in <body data-part>; matching parts get a boost and the word is not searched
  parts: { /* "admin": "Admin" */ }
  // strings: { … }  optional overrides for the UI strings below (any key of STR.en)
};
/* ==================================================================== */
</script>
<style>
/* ---------- chat page (on top of book.css) ---------- */
.chat{grid-column:wide;display:flex;flex-direction:column;min-height:calc(100vh - 56px);min-height:calc(100dvh - 56px);min-width:0}
.chat-head{padding:40px 0 18px}
.chat-k{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep)}
.chat-head h1{margin:6px 0 10px;font-family:var(--font-display);font-weight:750;font-size:clamp(2.2rem,6vw,3.4rem);line-height:1;letter-spacing:-.035em}
.chat-lede{margin:0;max-width:40rem;font-size:1.12rem;color:var(--ink-2)}
.mode{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:5px 12px 5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.86rem;color:var(--ink-2)}
.mode::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.mode.on::before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.conv{flex:1;display:flex;flex-direction:column;gap:22px;padding:8px 0 24px;min-width:0}
.sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:10px;margin:6px 0 0}
.sugg-t{margin:18px 0 4px;font-family:var(--font-display);font-weight:700;font-size:1rem}
.sugg button{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  font:inherit;font-size:.97rem;line-height:1.4;color:var(--ink);cursor:pointer}
.sugg button:hover{border-color:var(--accent)}
.sugg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sugg .tag{flex:none;margin-top:1px;padding:1px 8px;border-radius:99px;font-size:.72rem;font-weight:700;background:var(--accent-soft);color:var(--accent-deep)}
.sugg .tag.pl{background:var(--info-soft);color:var(--info)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sugg .tag.ad{background:var(--violet-soft);color:var(--violet)}

.msg{min-width:0}
.msg.user{align-self:flex-end;max-width:min(36rem,92%);padding:10px 16px;border-radius:18px 18px 4px 18px;background:var(--ink);color:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
.bot-av{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--accent)}
.bot-av svg{width:16px;height:16px;fill:currentColor}
.bot-body{min-width:0}
.bot-text{min-width:0}
.bot-text>p,.bot-text>ul,.bot-text>ol{max-width:43rem}
.bot-text>p:last-child,.bot-text>ul:last-child,.bot-text>ol:last-child{margin-bottom:0}
.bot-text code{font-family:var(--font-mono);font-size:.88em;padding:1px 5px;border-radius:6px;background:var(--paper-2)}
.bot-note{margin:8px 0 0;font-size:.88rem;color:var(--muted)}
.bot-note.err{color:var(--danger)}
.status{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--muted)}
.status:empty{display:none}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bl 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}

.cite{display:inline-flex;align-items:center;gap:5px;max-width:100%;margin:0 2px;padding:1px 9px 1px 7px;border-radius:99px;vertical-align:1px;
  background:var(--accent-soft);border:1px solid color-mix(in oklch,var(--accent) 22%,transparent);color:var(--accent-deep);
  font-size:.78rem;font-weight:650;line-height:1.55;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cite:hover{border-color:var(--accent);color:var(--ink)}
.cite svg{flex:none;width:12px;height:12px}
.cite span{overflow:hidden;text-overflow:ellipsis}

.chat-fig{margin:16px 0 18px;min-width:0}
.chat-fig-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px;font-size:.88rem;color:var(--muted)}
.chat-fig-h b{color:var(--ink);font-family:var(--font-display);font-size:1rem}
.chat-fig-h a{margin-left:auto;font-weight:650;white-space:nowrap}
.chat-fig-b{min-width:0;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.chat-fig-b>.flow{margin:0;padding:0;border:0;box-shadow:none;background:none}
.chat-fig-b>.fig,.chat-fig-b>.states{margin:0}
.chat-fig-b>.legend{margin-top:14px}
.chat-fig.is-flow .chat-fig-b{padding:18px}

.res{display:grid;gap:12px}
.res-card{min-width:0;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.res-card h3{margin:6px 0 4px;font-size:1.08rem}
.res-card h3 a{color:var(--ink);text-decoration:none}
.res-card h3 a:hover{text-decoration:underline}
.res-card p{margin:0;font-size:.95rem;color:var(--ink-2);overflow-wrap:anywhere}
.res-card mark{background:var(--sun-soft);color:inherit;border-radius:3px;padding:0 1px}
.res-kind{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.res-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn-s{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:.86rem;font-weight:650;color:var(--ink-2);cursor:pointer;text-decoration:none}
.btn-s:hover{border-color:var(--ink-2);color:var(--ink)}
.btn-s svg{width:14px;height:14px}
.res-card .chat-fig{margin:12px 0 0}

.composer{position:sticky;bottom:0;z-index:50;margin:0 calc(-1 * var(--gutter));padding:10px var(--gutter) 14px;
  background:linear-gradient(to bottom,transparent,var(--paper) 18px)}
.composer form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;padding:8px;border-radius:20px;background:var(--card);
  border:1px solid var(--line);box-shadow:0 14px 34px -24px oklch(24% .02 265 / .5)}
.composer form:focus-within{border-color:var(--accent)}
.composer textarea{resize:none;border:0;outline:0;background:none;font:inherit;font-size:1rem;line-height:1.45;color:var(--ink);padding:8px 8px;max-height:9.5em;min-height:2.4em}
.composer .acts{display:flex;gap:6px}
.send,.stop{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:14px;border:0;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
.send{background:var(--ink);color:#fff}
.send:disabled{opacity:.35;cursor:default}
.stop{background:var(--danger-soft);color:var(--danger)}
.send svg,.stop svg{width:16px;height:16px}
.composer-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;margin-top:6px;padding:0 6px;font-size:.8rem;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent-deep);text-decoration:underline;text-underline-offset:.18em;cursor:pointer}
[hidden]{display:none!important}
@media (max-width:640px){
  .chat-head{padding-top:26px}
  .msg.bot{grid-template-columns:minmax(0,1fr)}
  .bot-av{display:none}
  .chat-fig-b{padding:10px;border-radius:16px}
  .chat-fig-h a{margin-left:0}
  .send span{display:none}.send{padding:0 13px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="cuprins.html" data-cover><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></span><span data-t="book"></span></a>
    <div class="topbar-where"><b data-t="title"></b></div>
    <nav class="topbar-nav" aria-label="Navigation">
      <a href="cuprins.html" data-cover><svg class="book-ico"><use href="#i-list"/></svg><span class="lbl" data-t="contents"></span></a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="chat">
    <header class="chat-head">
      <div class="chat-k" data-t="kicker"></div>
      <h1 data-t="title"></h1>
      <p class="chat-lede" data-t="lede"></p>
      <div class="mode" id="mode" role="status"></div>
    </header>

    <section class="conv" id="conv" aria-live="polite">
      <div id="empty">
        <div class="sugg-t" data-t="try"></div>
        <div class="sugg" id="sugg"></div>
      </div>
    </section>

    <div class="composer">
      <form id="form" autocomplete="off">
        <label for="q" class="sr-only" data-t="yourQuestion"></label>
        <textarea id="q" rows="1" enterkeyhint="send"></textarea>
        <div class="acts">
          <button type="button" class="stop" id="stop" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span data-t="stop"></span></button>
          <button type="submit" class="send" id="send" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg><span data-t="send"></span></button>
        </div>
      </form>
      <div class="composer-foot">
        <span id="hint" data-t="hint"></span>
        <button type="button" class="linkbtn" id="reset" hidden data-t="reset"></button>
      </div>
    </div>
  </div>
</main>

  function fmt(s, o) { return String(s).replace(/\{(\w+)\}/g, function (_, k) { return o[k]; }); }

  });
  if (CFG.cover) [].slice.call(document.querySelectorAll("[data-cover]")).forEach(function (a) { a.setAttribute("href", CFG.cover); });

  /* ------------------------------------------------------------ state -- */
  var STORE = CFG.store || "ui-book-chat:v1";
  var MAX_FIGS = 2;
  var S = {

  var SUGG = CFG.suggestions || [];

  /* ------------------------------------------------------------ data -- */
  function loadScript(src, name) {
    return new Promise(function (ok, no) {
      if (window[name]) return ok(window[name]);
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { window[name] ? ok(window[name]) : no(new Error(src)); };

    });
  }
  // JSON first; from file:// (where fetch is blocked) the .js twin

    return fetch("assets/" + base + ".json").then(function (r) { if (!r.ok) throw 0; return r.json(); }).catch(viaScript);

  // BM25 over title (×3), chapter + section (×1.5) and text, with diacritic

  function fold(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[şș]/gi, "s").replace(/[ţț]/gi, "t").toLowerCase(); }

    for (var i = 0; i < SUF.length; i++) {
      var s = SUF[i];

    if (shown.length) return Promise.resolve();
    var re = /\[\[([^\]]+)\]\]/g, m, want = null;
    while ((m = re.exec(text)) && !want) {
      m[1].split(/[\s,;]+/).forEach(function (id) {
        var r = resolve(id);
        if (!want && r && r.figureId && (r.kind === "flow" || r.kind === "legend" || r.kind === "flow-step" || !S.tools)) want = r.figureId;
      });
    }
    if (!want) return Promise.resolve();
    shown.push(want);
    return showFigure(bot, want);
  }

  /* ------------------------------------------------------------ send -- */
  function setBusy(on) {
    S.busy = on;
    stop.hidden = !(on && S.mode === "chat");
    syncSend();
  }
  function syncSend() { send.disabled = S.busy || !q.value.trim() || Date.now() < S.cooldown; }
  function cooldownTick() {
    syncSend();
    if (Date.now() < S.cooldown) setTimeout(cooldownTick, 1000);
  }
  function ask(text) {
    text = String(text || "").trim();
    if (!text || S.busy || Date.now() < S.cooldown) return;
    q.value = ""; grow(); syncSend();
    var u = addUser(text);
    S.turns.push({ role: "user", content: text });
    save();
    u.scrollIntoView({ block: "start", behavior: "smooth" });
    var bot = addBot();
    setBusy(true);
    var p = S.mode === "chat" && S.sample ? askClaude(text, bot) : answerBySearch(text, bot);
    p.catch(function () { bot.idle(); bot.note(T.failed, true); })
      .then(function () { setBusy(false); S.ctl = null; q.focus(); });
  }
  $("form").addEventListener("submit", function (e) { e.preventDefault(); ask(q.value); });
  q.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value); }
  });
  function grow() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; }
  q.addEventListener("input", function () { grow(); syncSend(); });
  stop.addEventListener("click", function () { if (S.ctl) S.ctl.abort(); });
  resetBtn.addEventListener("click", function () {
    if (S.ctl) S.ctl.abort();
    S.turns = [];
    save();
    [].slice.call(conv.querySelectorAll(".msg")).forEach(function (m) { m.remove(); });
    empty.hidden = false;
    resetBtn.hidden = true;
    q.focus();
  });

  /* ------------------------------------------------------------ suggestions -- */
  SUGG.forEach(function (s) {
    var b = el("button", "", '<span class="tag ' + s[1] + '">' + esc(s[0]) + "</span><span>" + esc(s[2]) + "</span>");
    b.type = "button";
    b.addEventListener("click", function () { ask(s[2]); });
    $("sugg").appendChild(b);
  });

  /* ------------------------------------------------------------ mode -- */
  function setMode(m) {
    S.mode = m;
    modeEl.classList.toggle("on", m === "chat");
    modeEl.textContent = m === "chat" ? T.modeChat : T.modeSearch;
    stop.hidden = !(S.busy && m === "chat");
  }
  (function connect() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") return;
    var timeout = new Promise(function (ok) { setTimeout(function () { ok(null); }, 10000); });
    Promise.race([Promise.resolve().then(function () { return c.use("sample"); }), timeout]).then(function (fn) {
      if (typeof fn !== "function") return;
      S.sample = fn;
      var lim = typeof fn.limits === "function" ? fn.limits() : Promise.reject();
      return Promise.resolve(lim).then(function (l) { S.tools = !!(l && l.tools); }, function () { S.tools = false; }).then(function () { setMode("chat"); });
    }).catch(function () {});
  })();

  /* ------------------------------------------------------------ storage -- */
  // per-viewer convenience only: the last conversation survives a reload
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ turns: S.turns.slice(-30) })); } catch (e) {}
  }
  function restore() {
    var data = null;
    try { data = JSON.parse(localStorage.getItem(STORE) || "null"); } catch (e) {}
    if (!data || !data.turns || !data.turns.length) return;
    S.turns = data.turns;
    ixReady.then(function () {
      S.turns.forEach(function (t) {
        if (t.role === "user") { addUser(t.content); return; }
        var bot = addBot();
        if (t.mode === "search") {
          bot.note(T.searchResults).classList.add("lead");
          bot.body.insertBefore(bot.body.lastChild, bot.status);
          renderResults(bot, t.query || "", t.ids || []);
        } else {
          bot.text.innerHTML = markdown(t.content, false);
          var figs = t.figs || [];
          Promise.all(figs.map(function (k) { return showFigure(bot, k); })).then(function () { placeFigures(bot, figs); });
        }
      });
    });
  }
  setMode("search");
  restore();
})();
</script>
</body>
</html>
